<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Histórias Sinistras</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="main.js"></script>
    <script>
      var app = Elm.Main.init({ node: document.getElementById("app") });

      app.ports.progressoPedir.subscribe(function () {
        var salvo = localStorage.getItem("historias-sinistras.progresso");
        app.ports.progressoRecebido.send(salvo ? salvo : "{}");
      });

      app.ports.progressoSalvar.subscribe(function (json) {
        localStorage.setItem("historias-sinistras.progresso", json);
      });
    </script>
  </body>
</html>
